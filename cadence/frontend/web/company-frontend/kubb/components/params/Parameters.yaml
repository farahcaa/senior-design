components:
  parameters:

    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        example: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        example: 10

    SortParam:
      name: sort
      in: query
      required: false
      description: Sorting criteria (e.g. "priceMonthly,asc").
      schema:
        type: string
        example: "priceMonthly,asc"
