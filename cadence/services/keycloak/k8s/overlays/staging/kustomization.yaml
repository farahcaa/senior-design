apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base
  - ingressroute.yaml
  - external-secrets.yaml

configMapGenerator:
  - name: scripts
    files:
      - start-keycloak.sh
  - name: env
    behavior: merge
    envs:
      - keycloak.env
  - name: realm
    files:
      - realm.json

generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/company/keycloak
    newName: ghcr.io/company/keycloak
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deployment
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull-secret
    target:
      kind: Deployment
      name: deployment
  # Staging runs a small in-cluster Postgres (prod uses managed Postgres).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak-postgres-deployment
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
    target:
      kind: Deployment
      name: keycloak-postgres-deployment
