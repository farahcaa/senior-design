apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: admin-secret
  data:
    - secretKey: username
      remoteRef:
        key: company/staging/keycloak
        property: admin-username
    - secretKey: password
      remoteRef:
        key: company/staging/keycloak
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret-keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-secret-keycloak
  data:
    - secretKey: username
      remoteRef:
        key: company/staging/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: company/staging/postgres
        property: password
