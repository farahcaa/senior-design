# Dev-only route: minikube Traefik answers on plain HTTP for keycloak.localhost.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`keycloak.localhost`)
      services:
        - name: keycloak-service
          port: 80
