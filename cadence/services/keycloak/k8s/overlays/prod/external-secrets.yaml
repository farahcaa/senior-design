apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: admin-secret
  data:
    - secretKey: username
      remoteRef:
        key: company/prod/keycloak
        property: admin-username
    - secretKey: password
      remoteRef:
        key: company/prod/keycloak
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret-keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-secret-keycloak
  data:
    - secretKey: username
      remoteRef:
        key: company/prod/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: company/prod/postgres
        property: password
    # Connection details of the managed Postgres instance (Supabase).
    - secretKey: host
      remoteRef:
        key: company/prod/postgres
        property: keycloak-host
    - secretKey: port
      remoteRef:
        key: company/prod/postgres
        property: keycloak-port
    - secretKey: database
      remoteRef:
        key: company/prod/postgres
        property: keycloak-database
