apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: app-

resources:
  - deployment.yaml
  - service.yaml
  - ./postgres

patches:
  - path: env-patch.yaml

configMapGenerator:
  - name: env
    envs:
      - app.env
  - name: db-env
    envs:
      - db.env

labels:
  - pairs:
      app: app
    includeSelectors: true
    includeTemplates: true
