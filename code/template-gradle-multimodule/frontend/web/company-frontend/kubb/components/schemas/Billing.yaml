components:
  schemas:
    CheckoutSessionRequest:
      type: object
      required:
        - returnUrl
      properties:
        returnUrl:
          type: string
          example: "https://app.example.com/account/upgrade/return?session_id={CHECKOUT_SESSION_ID}"

    CheckoutSessionResponse:
      type: object
      required:
        - clientSecret
      properties:
        clientSecret:
          type: string
          example: cs_test_...

    ManageBillingResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          example: "https://billing.stripe.com/session/..."
