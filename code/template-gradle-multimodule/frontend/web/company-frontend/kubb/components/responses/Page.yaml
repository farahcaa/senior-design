components:
  schemas:
    Page:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        content:
          type: array
          items:
            type: object
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          format: int32
          minimum: 0
          example: 3
        nextPage:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          example: 1
