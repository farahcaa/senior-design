# Version catalog for the Gradle build. Spring-managed libraries (Jackson, Hibernate,
# Liquibase, the Postgres driver, SLF4J, ...) intentionally have no entry here: their
# versions come from the Spring Boot BOM via the dependency-management plugin.

[versions]
spring-boot = "3.5.8"
spring-dependency-management = "1.1.7"
jib = "3.4.5"
stripe = "31.4.0"
sentry = "7.20.0"
mapstruct = "1.6.3"
jetbrains-annotations = "26.0.1"

[libraries]
stripe-java = { module = "com.stripe:stripe-java", version.ref = "stripe" }
sentry-spring-boot = { module = "io.sentry:sentry-spring-boot-starter-jakarta", version.ref = "sentry" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
