apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  # Recreate, never RollingUpdate: one PVC, and two postgres pods sharing a data dir
  # corrupts the WAL (bitten on staging 2026-07-08).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: keycloak
      component: postgres
  template:
    metadata:
      labels:
        app: keycloak
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-trixie
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-env
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret-keycloak
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret-keycloak
                  key: password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pv-claim
