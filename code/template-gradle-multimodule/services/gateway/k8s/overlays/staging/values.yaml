fullnameOverride: gateway

ports:
  web:
    port: 80
  websecure:
    port: 443

# Dashboard stays private — port-forward when needed.
ingressRoute:
  dashboard:
    enabled: false
api:
  dashboard: true
  insecure: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
