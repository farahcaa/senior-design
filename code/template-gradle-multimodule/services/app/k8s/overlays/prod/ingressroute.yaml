apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-ingressroute
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.company.com`)
      kind: Rule
      services:
        - name: app-service
          port: 80
    # Stripe webhook host — only the webhook path is exposed here.
    - match: Host(`stripe.company.com`) && PathPrefix(`/api/stripe/webhook`)
      kind: Rule
      services:
        - name: app-service
          port: 80
