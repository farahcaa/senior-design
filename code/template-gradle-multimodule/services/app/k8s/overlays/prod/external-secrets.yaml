
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: stripe-secret
    template:
      data:
        STRIPE_API_KEY: "{{ .apiKey }}"
        STRIPE_WEBHOOK_SECRET: "{{ .webhookSecret }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: company/prod/app
        property: stripe-api-key
    - secretKey: webhookSecret
      remoteRef:
        key: company/prod/app
        property: stripe-webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-secret
  data:
    - secretKey: username
      remoteRef:
        key: company/prod/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: company/prod/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: backup-secrets
  data:
    - secretKey: ssh-key
      remoteRef:
        key: company/prod/backup
        property: ssh-private-key
    - secretKey: healthcheck-url
      remoteRef:
        key: company/prod/backup
        property: healthcheck-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentry-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sentry-secret
    template:
      data:
        SENTRY_DSN: "{{ .dsn }}"
  data:
    - secretKey: dsn
      remoteRef:
        key: company/prod/app
        property: sentry-dsn
---
# Transactional email (Resend). Put the API key in Vault at company/prod/app
# under property resend-api-key. Absent -> ResendEmailService logs-and-degrades (no emails sent).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resend-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: resend-secret
    template:
      data:
        RESEND_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: company/prod/app
        property: resend-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
    template:
      data:
        KEYCLOAK_ADMIN_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: company/prod/app
        property: keycloak-admin-client-secret
