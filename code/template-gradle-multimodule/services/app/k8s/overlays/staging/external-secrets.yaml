apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: stripe-secret
    template:
      data:
        STRIPE_API_KEY: "{{ .apiKey }}"
        STRIPE_WEBHOOK_SECRET: "{{ .webhookSecret }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: company/staging/app
        property: stripe-api-key
    - secretKey: webhookSecret
      remoteRef:
        key: company/staging/app
        property: stripe-webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-secret
  data:
    - secretKey: username
      remoteRef:
        key: company/staging/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: company/staging/postgres
        property: password
---
# Backup-only secrets for the nightly pg_dump CronJob (../../base/backup). Put ssh-private-key (to
# reach the backup VM) and the healthchecks.io ping URL under company/staging/backup in
# Vault. The age PRIVATE key stays in your password manager, never in the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: backup-secrets
  data:
    - secretKey: ssh-key
      remoteRef:
        key: company/staging/backup
        property: ssh-private-key
    - secretKey: healthcheck-url
      remoteRef:
        key: company/staging/backup
        property: healthcheck-url
---
# Sentry DSN for backend error tracking. Put it in Vault at company/staging/app under
# property sentry-dsn (paste the DSN from your Sentry project settings). Becomes the SENTRY_DSN env
# var via the sentry-secret; when absent, Sentry is simply disabled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentry-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sentry-secret
    template:
      data:
        SENTRY_DSN: "{{ .dsn }}"
  data:
    - secretKey: dsn
      remoteRef:
        key: company/staging/app
        property: sentry-dsn
---
# Transactional email (Resend). Put the API key in Vault at company/staging/app
# under property resend-api-key. Absent -> ResendEmailService logs-and-degrades (no emails sent).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resend-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: resend-secret
    template:
      data:
        RESEND_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: company/staging/app
        property: resend-api-key
---
# Keycloak Admin API credential: the app-backend client secret (Keycloak admin console ->
# Clients -> app-backend -> Credentials). Vault property keycloak-admin-client-secret at
# company/staging/app. Needed for in-app name/email changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
    template:
      data:
        KEYCLOAK_ADMIN_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: company/staging/app
        property: keycloak-admin-client-secret
