name: CI

# Quality gate: type-check, lint, and compile on every PR and on pushes to the deploy
# branches. Deploys (deploy-staging/deploy-prod) build independently — this gate exists so a
# type error or broken build is flagged red before/alongside a deploy, instead of silently
# shipping (vite build does NOT type-check, so type errors can otherwise reach production).
on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web/company-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build
