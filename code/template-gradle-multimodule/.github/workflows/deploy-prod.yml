name: Deploy to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/company
  # Must match the OCIRepository url in company-cluster (prod/phase-manifests).
  MANIFESTS_REF: ghcr.io/company/manifests

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "IMAGE_TAG=prod-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app (Jib)
        run: >
          ./gradlew :services:app:jib
          -Djib.to.image=${REGISTRY}/app:${IMAGE_TAG}

      - name: Build & push keycloak image
        uses: docker/build-push-action@v6
        with:
          context: services/keycloak/theme-image
          push: true
          tags: ghcr.io/company/keycloak:${{ env.IMAGE_TAG }}

      - name: Build & push pg-backup image
        uses: docker/build-push-action@v6
        with:
          context: services/app/k8s/base/backup
          push: true
          tags: ghcr.io/company/pg-backup:${{ env.IMAGE_TAG }}

      - name: Setup kustomize / helm / flux
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Render & push manifests bundle
        run: |
          scripts/render-manifests.sh prod "${IMAGE_TAG}" "${REGISTRY}"
          flux push artifact "oci://${MANIFESTS_REF}:${IMAGE_TAG}" \
            --path rendered/prod \
            --source "${{ github.repositoryUrl }}" \
            --revision "${{ github.sha }}"

      - name: Update manifest tag in cluster repo
        env:
          CLUSTER_REPO_TOKEN: ${{ secrets.CLUSTER_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${CLUSTER_REPO_TOKEN}@github.com/company/company-cluster.git /tmp/company-cluster
          cd /tmp/company-cluster
          sed -i "s|tag: prod-[a-f0-9]*|tag: ${IMAGE_TAG}|" prod/phase-manifests/manifests.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prod/phase-manifests/manifests.yaml
          git diff --staged --quiet || git commit -m "chore: update prod manifests tag to ${IMAGE_TAG}"
          git push

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web/company-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (production)
        run: bun run build:production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/web/company-frontend
          command: pages deploy --project-name=company-frontend --branch=production
